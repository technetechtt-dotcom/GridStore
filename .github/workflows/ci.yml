name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install server
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Audit server dependencies
        continue-on-error: true
        run: npm audit --prefix server --audit-level=high

      - name: Test
        run: npm run test

      - name: Test server
        run: npm run test:server

      - name: Build
        run: npm run build

      - name: Build admin
        run: npm run build:admin

  migrate-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridstore
          POSTGRES_PASSWORD: gridstore
          POSTGRES_DB: gridstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridstore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install server
        run: npm ci --prefix server
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://gridstore:gridstore@localhost:5432/gridstore_test
        run: npm run migrate:smoke --prefix server

      - name: Postgres concurrency tests
        env:
          DATABASE_URL: postgresql://gridstore:gridstore@localhost:5432/gridstore_test
          RUN_PG_INTEGRATION: "true"
          VITEST: "false"
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-for-prod
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
          ENABLE_DEMO_DATA: "true"
        run: npx vitest run src/postgres.integration.test.ts
        working-directory: server

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
